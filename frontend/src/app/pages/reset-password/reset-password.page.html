<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Restablecer Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="reset-password-container">
    <h2>Restablecer tu Contraseña</h2>
    <p *ngIf="!token" class="ion-text-danger">Error: No se encontró el token de recuperación.</p>
    <p *ngIf="token">Ingresa tu nueva contraseña.</p>

    <form (ngSubmit)="resetMyPassword()">
      <ion-item>
        <ion-label position="floating">Nueva Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="newPassword" name="newPassword" required></ion-input>
      </ion-item>

      <ion-item class="ion-margin-top">
        <ion-label position="floating">Confirmar Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="!token">
        Restablecer Contraseña
      </ion-button>
    </form>

    <ion-button expand="block" fill="clear" routerLink="/login" class="ion-margin-top">
      Volver al Inicio de Sesión
    </ion-button>
  </div>
</ion-content>
